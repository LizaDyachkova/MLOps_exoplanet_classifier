[project]
name = "mlops-exoplanet-classifier"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "faststream[cli,rabbit]>=0.7.7",
    "mlflow-skinny>=3.17.0",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "structlog>=26.1.0",
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
    "testcontainers[rabbitmq]>=4.15.0",
]
train = [
    "matplotlib>=3.11.2",
    "mlflow>=3.17.0",
    "seaborn>=0.13.2",
]

[tool.uv]
default-groups = ["dev", "train"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "BLE"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

addopts = "--cov=src --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "src/run_eda.py", "src/train.py"]

[tool.coverage.report]
show_missing = true
