services:
  postgres:
    image: postgres:16-alpine
    container_name: exoplanet_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: exoplanet_classifier
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - exoplanet_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d exoplanet_classifier" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: exoplanet_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/exoplanet_classifier"
      PORT: 8000
      MLFLOW_TRACKING_URI: "http://mlflow_server:5000"
      MODEL_NAME: "kepler_exoplanet_classifier"
      MODEL_ALIAS: "champion"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
    networks:
      - exoplanet_network
    depends_on:
      postgres:
        condition: service_healthy
      mlflow_server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "src.worker"]
    expose:
      - "8001"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/exoplanet_classifier"
      MLFLOW_TRACKING_URI: "http://mlflow_server:5000"
      MODEL_NAME: "kepler_exoplanet_classifier"
      MODEL_ALIAS: "champion"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
      PREFETCH_COUNT: "1"
      INFERENCE_DELAY_SECONDS: "0.5"
      WORKER_HEALTH_PORT: "8001"
    networks:
      - exoplanet_network
    depends_on:
      postgres:
        condition: service_healthy
      mlflow_server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mlflow_db:
    image: postgres:16-alpine
    container_name: mlflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow_password
      POSTGRES_DB: mlflow_db
    ports:
      - "5433:5432"
    volumes:
      - mlflow_db_data:/var/lib/postgresql/data
    networks:
      - exoplanet_network

  mlflow_server:
    image: ghcr.io/mlflow/mlflow:v3.17.0
    container_name: mlflow_server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - MLFLOW_BACKEND_STORE_URI=postgresql+psycopg2://mlflow:mlflow_password@mlflow_db:5432/mlflow_db
    volumes:
      - ./mlflow_artifacts:/mlflow/artifacts
    networks:
      - exoplanet_network
    depends_on:
      - mlflow_db
    command: >
      bash -c "pip install psycopg2-binary && mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri postgresql+psycopg2://mlflow:mlflow_password@mlflow_db:5432/mlflow_db --default-artifact-root mlflow-artifacts:/ --artifacts-destination /mlflow/artifacts --serve-artifacts --allowed-hosts localhost:*,127.0.0.1:*,mlflow_server:*"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  rabbitmq:
    image: rabbitmq:3-management
    container_name: exoplanet_rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - exoplanet_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  exoplanet_network:
    driver: bridge

volumes:
  postgres_data:
  mlflow_db_data:
